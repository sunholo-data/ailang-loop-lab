[package]
name = "sunholo/live_loop_lab"
version = "0.2.0"
edition = "1"
ailang = ">=0.54.18"
description = "Local four-part loop instrument: private take levels, boundary-safe undo/redo and committed WAV downloads; pure revision planner and deterministic fixtures; never published"
license = "Apache-2.0"
[exports]
modules = ["sunholo/live_loop_lab/planner", "sunholo/live_loop_lab/assets"]
[dependencies]
# Prerelease integration pin; switch to the registry's exact 0.3.0 after publication.
"sunholo/audio" = {git = "https://github.com/sunholo-data/ailang-packages.git", rev = "93314fc581a7ee2fefdc82392a92228f8b01a2dd", subdir = "packages/audio"}
[effects]
max = ["IO", "FS"]
[metadata]
license_url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
ai_summary = "Local four-part loop instrument with pure AILANG frame/revision planning, bounded private capture and a browser worker adapter for audio 0.3 level policies. Private Off/PeakSafe/Matched decisions retain an unlevelled original. One previous committed version per part supports boundary-staged undo/redo; active committed mono PCM16 WAV downloads can be imported into Live. Raw/private/pending takes never enter exports or API payloads. No registry release; browser/device acceptance is distinct from unit/integration evidence."
repository = "https://github.com/sunholo-data/ailang-loop-lab"
[stability]
level = "experimental"
[release]
kind = "feature"
