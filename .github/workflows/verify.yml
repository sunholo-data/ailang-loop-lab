name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned AILANG and solver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          mkdir -p "$RUNNER_TEMP/ailang"
          gh release download v0.54.18 --repo sunholo-data/ailang -p linux.x64.ailang.tar.gz -p SHA256SUMS -D "$RUNNER_TEMP/ailang"
          cd "$RUNNER_TEMP/ailang"
          sha256sum --ignore-missing -c SHA256SUMS
          tar xzf linux.x64.ailang.tar.gz
          echo "$RUNNER_TEMP/ailang" >> "$GITHUB_PATH"
      - name: Resolve declared dependency and verify
        run: |
          ailang lock
          make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-quality
          path: quality-local.json
